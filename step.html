<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="質問に答えると、独占契約書ができるフォームです。個人が作った非公式のもので、法的な効力もありません。">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>独占契約書メーカー（非公式）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 設計: 1問1画面。スマホは「質問→条文カード→次へ」の縦積み、PC(900px以上)は左に質問・右に契約書を常時表示。
   色はフラット（グレー＋ネイビー）。朱色は印影だけ。 */
:root{
  --bg:#eef2f5;
  --surface:#ffffff;
  --card:#f5f6f8;
  --ink:#1b2630;
  --muted:#5d6872;
  --line:#d6dadd;
  --sub:#b9bdc4;
  --main:#c3cad4;
  --accent:#1f3a5f;
  --accent-ink:#10192b;
  --mark:rgba(140,155,180,.30);
  --mark-ink:#1f3a5f;
  --shadow:0 1px 2px rgb(20 40 60 / .10),0 10px 28px rgb(20 40 60 / .10);
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b;--surface:#18212a;--card:#1b2630;--ink:#e6edf2;--muted:#9aa7b2;--line:#2a3641;--sub:#5b6670;
    --accent:#a9b9d3;--accent-ink:#0d1522;--mark:rgba(169,185,211,.28);--mark-ink:#c9d6ea;
    --shadow:0 1px 2px rgb(0 0 0 / .4),0 10px 28px rgb(0 0 0 / .45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b;--surface:#18212a;--card:#1b2630;--ink:#e6edf2;--muted:#9aa7b2;--line:#2a3641;--sub:#5b6670;
  --accent:#a9b9d3;--accent-ink:#0d1522;--mark:rgba(169,185,211,.28);--mark-ink:#c9d6ea;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 10px 28px rgb(0 0 0 / .45);
  color-scheme:dark;
}

body{
  font-family:var(--font-ui);font-size:16px;line-height:1.65;
  background:var(--bg);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 130px;
}
button{font:inherit;color:inherit}
.layout{max-width:520px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.stage{min-width:0}

/* 上部: 戻る・進み具合 */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0 10px;margin-bottom:14px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{min-height:44px;padding:0 12px 0 0;border:0;background:none;font-size:15px;font-weight:700;color:var(--accent);cursor:pointer}
.back:focus-visible,.btn:focus-visible,.chip-btn:focus-visible,.exc summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:var(--font-serif);font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--accent);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}

/* 画面 */
.screen{min-width:0;padding-top:6px}
.screen>*{animation:in .22s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen>*{animation:none}.prog i{transition:none}}

.eyebrow{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.badge{display:inline-block;margin-left:8px;padding:3px 8px;border:1px solid var(--accent);border-radius:4px;font-size:12px;line-height:1.3;letter-spacing:0;color:var(--accent);vertical-align:1px;white-space:nowrap}
h1{margin:0 0 12px;font-family:var(--font-serif);font-weight:700;font-size:clamp(30px,8.4vw,42px);line-height:1.25;text-wrap:balance}
.ph{display:inline-block}
[hidden]{display:none!important}
.cover{padding-top:20px;border-top:4px solid var(--main)}
.lead{margin:0 0 20px;color:var(--muted)}
.fine{margin:20px 0 0;font-size:13px;color:var(--muted)}
.alt{margin:-8px 0 20px}
.alt a{display:inline-block;padding:6px 0;font-size:14px;font-weight:700;color:var(--accent);text-underline-offset:3px}
.sample-k{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}

.q-tags{display:flex;gap:6px;margin-bottom:8px}
.tag{font-size:12px;line-height:1;padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.tag.req{border-color:var(--accent);color:var(--accent)}
.q-label{margin:0 0 16px;font-family:var(--font-serif);font-weight:700;font-size:clamp(20px,5.6vw,24px);line-height:1.5;text-wrap:balance;outline:none}

.field{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--sub);border-radius:10px;padding:14px 16px}
.field:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea.field{min-height:132px;resize:vertical;line-height:1.6}
.count-txt{margin:6px 0 0;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.opts{display:grid;gap:10px}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:flex;align-items:center;min-height:56px;padding:12px 16px;border:1px solid var(--sub);border-radius:10px;background:var(--surface);font-size:16px;font-weight:500;line-height:1.4}
.opt input:checked + span{background:var(--main);border-color:var(--main);color:var(--accent-ink);font-weight:700}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.opt.multi input:checked + span::before{content:"✓";margin-right:.5em}
.sp{margin-top:10px}

.exc{margin-top:14px}
.exc summary{display:inline-block;cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);padding:8px 0}
.exc-body{display:grid;gap:10px;margin-top:4px}
.exc-ex{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{font-size:14px;line-height:1.3;padding:8px 12px;border:1px dashed var(--sub);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 条文カード */
.clause{margin-top:22px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.clause-k{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.clause-t{margin:0;font-family:var(--font-serif);font-size:14.5px;line-height:1.9}
.art{font-weight:700;margin-right:.6em}
mark.hl{background:var(--mark);color:var(--mark-ink);font-weight:700;padding:0 1px;border-bottom:2px solid var(--mark-ink);-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* 下部ナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto}
.navmsg{margin:0 0 6px;font-size:13px;color:var(--muted);text-align:center;min-height:1.2em}
.navmsg:empty{display:none}
.btn{display:inline-block;box-sizing:border-box;font-size:15px;font-weight:700;line-height:1.3;padding:12px 18px;border-radius:10px;border:1px solid var(--main);background:var(--main);color:var(--accent-ink);text-align:center;text-decoration:none;cursor:pointer}
.btn.sub{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.big{display:block;width:100%;padding:15px 18px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* プレビュー・最後の画面 */
.preview{display:none;min-width:0}
body[data-mode="final"] .preview{display:block}
.pv-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.pv-head h2{margin:0;font-family:var(--font-serif);font-size:17px}
.pv-note{font-size:13px;color:var(--muted)}
.sheets{display:grid;gap:16px}
.sheets canvas{display:block;width:100%;height:auto;background:#ffffff;border-radius:2px;box-shadow:var(--shadow)}
.pv-wait{margin:0;padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.done h2{margin:0 0 8px;font-family:var(--font-serif);font-size:clamp(24px,6.4vw,30px);line-height:1.35}
.actions{min-width:0;display:grid;gap:14px;align-content:start}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act-grid .wide{grid-column:1 / -1}
.msg{margin:0;font-size:14px;color:var(--muted);min-height:1.5em}
.hint{margin:0;font-size:13px;color:var(--muted)}
.jumps-k{margin:6px 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.jumps{display:flex;flex-wrap:wrap;gap:8px}
.jumps .chip-btn{border-style:solid}
.restart{justify-self:start;margin-top:4px;border:0;background:none;padding:8px 0;font-size:14px;color:var(--muted);text-decoration:underline;cursor:pointer}
.savebox{padding:14px;background:var(--surface);border:1px solid var(--accent);border-radius:10px}
.savebox-msg{margin:0 0 12px;font-size:14px}
.savelist{display:grid;gap:14px;margin-bottom:12px}
.saveitem{display:grid;gap:8px;justify-items:start}
.saveitem img{display:block;width:100%;height:auto;background:#ffffff;border:1px solid var(--line)}
.fine-end{margin:8px 0 0;font-size:13px;color:var(--muted)}

/* パソコン: 左に質問、右に契約書を常時表示 */
@media (min-width:900px){
  body{padding-block:0 48px}
  .layout{max-width:1120px;grid-template-columns:minmax(0,520px) minmax(0,520px);justify-content:center;gap:0 64px;
    grid-template-areas:"stage preview" "actions preview";grid-template-rows:auto 1fr;align-items:start}
  .stage{grid-area:stage;padding-top:24px}
  .actions{grid-area:actions}
  .preview{display:block;grid-area:preview;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;padding:24px 6px 2px 2px;margin-top:0}
  .head{top:0}
  .nav{position:static;border:0;background:none;padding:22px 0 0}
  .nav-in{max-width:none}
}
</style>
</head>
<body>

<div class="layout">
  <section class="stage" id="stage">
    <header class="head" id="head" hidden>
      <div class="head-row">
        <button class="back" id="back" type="button">← 戻る</button>
        <span class="count" id="count">1 / 1</span>
      </div>
      <div class="prog" role="progressbar" aria-label="進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="prog"><i id="progfill"></i></div>
    </header>
    <div class="screen" id="screen"></div>
    <nav class="nav" id="nav" aria-label="次へ進む">
      <div class="nav-in">
        <p class="navmsg" id="navmsg" role="status"></p>
        <button class="btn big" id="next" type="button">はじめる</button>
      </div>
    </nav>
  </section>

  <aside class="preview" id="preview" aria-label="契約書プレビュー">
    <div class="pv-head"><h2>できあがりプレビュー</h2><span class="pv-note" id="pv-pages"></span></div>
    <div id="sheets" class="sheets"><p class="pv-wait" id="pv-wait">契約書を準備しています…</p></div>
  </aside>

  <div class="actions" id="actions" hidden>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="act-grid">
      <button class="btn" id="btn-png" type="button">PNG画像で保存</button>
      <button class="btn sub" id="btn-pdf" type="button">PDFで保存</button>
      <a class="btn sub wide" id="btn-x" href="#" target="_blank" rel="noopener noreferrer">Xに投稿する</a>
      <button class="btn sub wide" id="btn-show" type="button">保存できないとき：画像を表示（長押しで保存）</button>
    </div>
    <p class="hint">Xの投稿画面が開いたら、保存した画像を添付してください。</p>
    <div class="savebox" id="savebox" hidden>
      <p class="savebox-msg">画像を長押し（パソコンは右クリック）して「画像を保存」を選んでください。コピーして、そのままXの投稿画面に貼り付けることもできます。</p>
      <div class="savelist" id="savelist"></div>
      <button class="btn sub" id="btn-closebox" type="button">閉じる</button>
    </div>
    <div>
      <p class="jumps-k">答えを直したい質問を選ぶ</p>
      <div class="jumps" id="jumps"></div>
    </div>
    <button class="restart" id="restart" type="button">最初からやり直す</button>
    <p class="fine-end">個人が作った、非公式のフォームです。法的な効力もありません。</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  'use strict';

  /* ---- 企画側の設定 ---- */
  var CFG = {
    title: '恋人独占契約書',
    sub: '（恋人どうしの約束）',
    hashtag: '', /* 投稿文に付けるタグ。今は空（タグなし）。付けるときは '#タグ名' を入れる */
    partner: 'パートナー',
    date: '', /* 'YYYY-MM-DD' を入れると契約日になる。空欄なら「令和　年　月　日」 */
    watermark: true,
    wmText: 'SAMPLE',
    wmSub: '非公式',
    footer: '個人が作った、非公式のフォームです。法的な効力もありません。'
  };

  /* ---- 質問データ（ここを増減すると、画面・条文・条番号が自動で変わる） ----
     kind: text(前文用の名前) / single(1つ選ぶ) / multi(複数選ぶ) / free(自由記述)
     【】で囲んだ部分が、回答として強調される。
     条番号は並び順から自動採番（第1条は目的で固定）。 */
  var QUESTIONS = [
    { id: 'me', kind: 'text', short: 'ニックネーム', label: 'あなたのニックネーム', ph: '例：たろう', max: 12, required: true, reqMsg: 'ニックネームを入れると進めます' },
    { id: 'excl', kind: 'single', title: '独占', short: '二人きり', label: 'パートナー以外の人と二人きりで過ごすのは？', def: 'no',
      options: [
        { v: 'no', l: '二人きりはNG', t: '甲と乙は、互いを唯一の交際相手とし、第三者と恋愛関係になりません。また、第三者と【二人きりで過ごすことは行いません】。' },
        { v: 'report', l: '事前に伝えればOK', t: '甲と乙は、互いを唯一の交際相手とし、第三者と恋愛関係になりません。第三者と二人きりで過ごすときは、【事前に相手へ伝えます】。' },
        { v: 'free', l: '友人付き合いは自由', t: '甲と乙は、互いを唯一の交際相手とし、第三者と恋愛関係になりません。友人としての付き合いは、【互いに尊重します】。' }
      ],
      exc: { ph: '例：家族', ex: ['家族', '仕事関係', '友人'] } },
    { id: 'contact', kind: 'single', title: '連絡', short: '連絡', label: '連絡の頻度は？', def: 'daily',
      options: [
        { v: 'morning', l: '毎日おはようとおやすみ', t: '甲と乙は、【毎日「おはよう」と「おやすみ」の連絡】を取り合います。' },
        { v: 'daily', l: '1日1回は連絡', t: '甲と乙は、【1日に1回】は連絡を取り合います。' },
        { v: 'free', l: '気が向いたときでOK', t: '連絡の頻度は決めず、互いに【気が向いたときに連絡】します。返信できない事情があるときは、一言伝えます。' }
      ],
      exc: { ph: '例：残業の日', ex: ['残業の日', '旅行中', '仕事が忙しい日'] } },
    { id: 'phone', kind: 'single', title: 'スマホ', short: 'スマホ', label: '相手のスマホは見てもいい？', def: 'nolook',
      options: [
        { v: 'nolook', l: '見ない（信頼する）', t: '甲と乙は、相手のスマートフォンやメッセージを、【相手の同意なく見ません】。' },
        { v: 'consent', l: '同意があるときだけ', t: '甲と乙は、相手のスマートフォンを、【本人の同意があるときだけ】見ます。不安があるときは、まず言葉で伝えます。' },
        { v: 'open', l: 'お互いオープンにする', t: '甲と乙は、【互いにスマートフォンを隠さず】、相手に見られて困るやり取りをしないようにします。' }
      ],
      exc: { ph: '例：緊急のとき', ex: ['緊急のとき', '体調不良のとき', '紛失したとき'] } },
    { id: 'sns', kind: 'single', title: 'SNS', short: 'SNS', label: 'SNSでの、パートナー以外の人との交流は？', def: 'free',
      options: [
        { v: 'free', l: '今までどおり自由', t: 'SNSでの第三者とのやり取りは、【これまでどおり自由に】行います。ただし、相手が嫌な気持ちになる投稿やメッセージは控えます。' },
        { v: 'dm', l: 'DMは隠さない', t: 'SNSでの第三者との個別のメッセージ（DM）は、【相手に隠さず】、聞かれたら誰とのやり取りかを答えます。' },
        { v: 'min', l: '交流は控えめに', t: 'SNSでの第三者との私的な交流は、【最小限にとどめます】。' }
      ],
      exc: { ph: '例：趣味の交流', ex: ['趣味の交流', '仕事の連絡', '推し活'] } },
    { id: 'coat', kind: 'single', title: '持ち物の貸し出し', short: '上着', label: 'パートナーが他の人に貸していいもの（上着など）は？', def: 'small',
      options: [
        { v: 'none', l: '貸さない', t: '甲と乙は、上着や身に着ける物を、第三者に【貸しません】。' },
        { v: 'small', l: '小物まで（マフラー・ストールなど）', t: '甲と乙は、第三者に貸してよい物を、【マフラー、ストール、手袋、ブランケットなどの小物に限ります】。' },
        { v: 'ok', l: '上着もOK', t: '甲と乙は、上着を含め、身に着ける物を第三者に【貸してよい】ものとします。' }
      ],
      extra: { check: { l: '貸さずに新品を買って渡すのもOK', t: '貸す代わりに、【新品の物を買って渡す】こともできます。' }, note: { ph: 'ただし書き（任意）　例：雨の日だけ', max: 40 } } },
    { id: 'money', kind: 'single', title: 'お金', short: 'お金', label: 'デート代はどうする？', def: 'split',
      options: [
        { v: 'split', l: '割り勘', t: 'デート代などの費用は、原則として【割り勘】とします。' },
        { v: 'turn', l: '交代で払う', t: 'デート代などの費用は、【交代で支払います】。' },
        { v: 'more', l: '収入が多い方が多めに', t: 'デート代などの費用は、【収入の多い方が多めに負担します】。' },
        { v: 'talk', l: 'その都度相談', t: 'デート代などの費用は、【その都度話し合って決めます】。' }
      ],
      exc: { ph: '例：誕生日', ex: ['誕生日', '記念日', '旅行'] },
      after: 'お金の貸し借りは、必ず事前に相談します。' },
    { id: 'ex', kind: 'single', title: '過去の恋人', short: '過去の恋人', label: '過去の恋人との関わりは？', def: 'tell',
      options: [
        { v: 'none', l: '連絡を取らない', t: '甲と乙は、過去の恋人と、【連絡を取りません】。' },
        { v: 'tell', l: '事前に伝えればOK', t: '甲と乙は、過去の恋人と連絡を取るときは、【事前に相手へ伝えます】。' },
        { v: 'normal', l: '友人として自然に', t: '甲と乙は、過去の恋人であっても、【友人として自然に付き合ってよい】ものとします。' }

    } else if (q.kind === 'single') {
      h += '<div class="opts" role="radiogroup" aria-labelledby="ql">';
      for (i = 0; i < q.options.length; i++) {
        var o = q.options[i];
        h += '<label class="opt"><input type="radio" name="o" data-role="opt" data-q="' + q.id + '" value="' + o.v + '"' + (S.v[q.id] === o.v ? ' checked' : '') + '><span>' + esc(o.l) + '</span></label>';
      }
      h += '</div>';
      if (q.extra && q.extra.check) {
        h += '<div class="opts sp"><label class="opt multi"><input type="checkbox" data-role="chk" data-q="' + q.id + '"' + (S.chk[q.id] ? ' checked' : '') + '><span>' + esc(q.extra.check.l) + '</span></label></div>';
      }
      if (q.extra && q.extra.note) {
        h += '<input class="field sp" id="f-note" data-role="note" data-q="' + q.id + '" type="text" maxlength="' + q.extra.note.max + '" aria-label="ただし書き（任意）" placeholder="' + esc(q.extra.note.ph) + '" value="' + esc(S.note[q.id] || '') + '">';
      }
      if (q.exc) {
        h += '<details class="exc"' + (S.x[q.id] ? ' open' : '') + '><summary>＋ 例外を足す（15文字まで）</summary><div class="exc-body">' +
          '<input class="field" id="f-x" data-role="x" data-q="' + q.id + '" type="text" maxlength="15" aria-label="例外（15文字まで）" placeholder="' + esc(q.exc.ph) + '" value="' + esc(S.x[q.id] || '') + '">' +
          '<div class="exc-ex">' + q.exc.ex.map(function (e) { return '<button type="button" class="chip-btn" data-fill="' + esc(e) + '">' + esc(e) + '</button>'; }).join('') + '</div></div></details>';
      }
    } else if (q.kind === 'multi') {
      h += '<div class="opts" role="group" aria-labelledby="ql">';
      for (i = 0; i < q.options.length; i++) {
        var m = q.options[i];
        h += '<label class="opt multi"><input type="checkbox" name="m" data-role="multi" data-q="' + q.id + '" value="' + m.v + '"' + (S.v[q.id].indexOf(m.v) >= 0 ? ' checked' : '') + '><span>' + esc(m.l) + '</span></label>';
      }
      h += '</div>';
    }
    return h + clauseCard(q);
  }

  function coverHtml() {
    var sample = QUESTIONS.filter(function (q) { return q.kind === 'single'; })[0];
    return '<div class="cover"><p class="eyebrow">独占契約書フォーム、作ってみた<span class="badge">非公式</span></p>' +
      '<h1>独占契約書メーカー</h1>' +
      '<p class="lead">' + N + '個の質問に答えると、二人の独占契約書（画像とPDF）ができます。所要時間は1〜2分です。</p>' +
      '<p class="alt"><a href="index.html">まとめて答える版はこちら →</a></p>' +
      (sample ? '<p class="sample-k">答えるたびに、条文がこのように決まります</p>' + clauseCard(sample) : '') +
      '<p class="fine">個人が作った、非公式のフォームです。法的な効力もありません。回答は保存も送信もしません。ページを閉じると消えます。</p></div>';
  }
  function finalHtml() {
    return '<div class="done"><h2>できあがり！</h2><p class="lead">契約書はこちらです。保存して、Xに投稿してみましょう。</p></div>';
  }

  function updateNav() {
    var q = QUESTIONS[S.step], dis = false, msg = '';
    if (q && q.required && !String(S.v[q.id]).trim()) { dis = true; msg = q.reqMsg || ''; }
    nextBtn.disabled = dis;
    navmsg.textContent = msg;
  }
  function updateCard() {
    var q = QUESTIONS[S.step], el = $('clause');
    if (q && el) el.innerHTML = cardInner(q);
  }

  function renderStep() {
    var s = S.step;
    document.body.setAttribute('data-mode', s < 0 ? 'cover' : (s >= N ? 'final' : 'q'));
    head.hidden = s < 0;
    navEl.hidden = s >= N;
    $('actions').hidden = s < N;
    if (s < 0) screen.innerHTML = coverHtml();
    else if (s >= N) screen.innerHTML = finalHtml();
    else screen.innerHTML = questionHtml(QUESTIONS[s]);
    var pct = s < 0 ? 0 : Math.round(Math.min(s + 1, N) / N * 100);
    $('count').textContent = s >= N ? '完成' : (s + 1) + ' / ' + N;
    $('progfill').style.width = (s >= N ? 100 : pct) + '%';
    $('prog').setAttribute('aria-valuenow', String(s >= N ? 100 : pct));
    nextBtn.textContent = s < 0 ? 'はじめる' : (s === N - 1 ? '契約書を完成させる' : '次へ');
    updateNav();
    if (s >= N) { status = ''; updateActions(); }
    if (wantPreview()) schedule();
  }
  function go(step) {
    S.step = Math.max(-1, Math.min(N, step));
    $('savebox').hidden = true;
    renderStep();
    window.scrollTo(0, 0);
    var ql = $('ql');
    if (ql) { try { ql.focus({ preventScroll: true }); } catch (e) { /* 何もしない */ } }
  }

  /* ---- 入力 ---- */
  function changed() {
    status = '';
    updateCard(); updateNav();
    if (wantPreview()) schedule();
  }
  screen.addEventListener('input', function (e) {
    var t = e.target, r = t.getAttribute && t.getAttribute('data-role');
    if (!r) return;
    var id = t.getAttribute('data-q');
    if (r === 'text' || r === 'free') S.v[id] = t.value;
    else if (r === 'x') S.x[id] = t.value;
    else if (r === 'note') S.note[id] = t.value;
    else return;
    if (r === 'free') $('cnt').textContent = String(Array.from(t.value).length);
    changed();
  });
  screen.addEventListener('change', function (e) {
    var t = e.target, r = t.getAttribute && t.getAttribute('data-role');
    if (!r) return;
    var id = t.getAttribute('data-q');
    if (r === 'opt') S.v[id] = t.value;
    else if (r === 'chk') S.chk[id] = t.checked;
    else if (r === 'multi') S.v[id] = Array.prototype.map.call(screen.querySelectorAll('input[data-role="multi"]:checked'), function (i) { return i.value; });
    else return;
    changed();
  });
  screen.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.chip-btn') : null;
    if (!b || !b.hasAttribute('data-fill')) return;
    var i = $('f-x');
    if (i) { i.value = b.getAttribute('data-fill'); S.x[i.getAttribute('data-q')] = i.value; changed(); }
  });
  screen.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'f-text' && !e.isComposing && !nextBtn.disabled) { e.preventDefault(); go(S.step + 1); }
  });
  nextBtn.addEventListener('click', function () { if (!nextBtn.disabled) go(S.step + 1); });
  $('back').addEventListener('click', function () { go(S.step - 1); });
  if (mq.addEventListener) mq.addEventListener('change', function () { if (wantPreview()) schedule(); });

  /* ---- 最後の画面 ---- */
  var msgEl = $('msg'), btnPng = $('btn-png'), btnPdf = $('btn-pdf'), btnX = $('btn-x'), btnShow = $('btn-show');
  var busy = false, status = '';
  var J = window.jspdf && window.jspdf.jsPDF;
  function updateActions() {
    var ok = !!S.v.me.trim();
    btnPng.disabled = !(ok && !busy);
    btnPdf.disabled = !(ok && J && !busy);
    btnShow.disabled = !(ok && !busy);
    msgEl.textContent = status || (J ? '' : 'PDF保存の部品を読み込めませんでした。PNG画像で保存してください。');
  }
  function say(s) { status = s; updateActions(); }

  QUESTIONS.forEach(function (q, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip-btn';
    b.textContent = 'Q' + (i + 1) + ' ' + q.short;
    b.addEventListener('click', function () { go(i); });
    $('jumps').appendChild(b);
  });
  var armed = false, rbtn = $('restart');
  rbtn.addEventListener('click', function () {
    if (!armed) { armed = true; rbtn.textContent = '回答がすべて消えます。もう一度押すとやり直します'; return; }
    armed = false; rbtn.textContent = '最初からやり直す';
    S = freshState(); go(-1);
  });

  function fileBase() {
    var s = S.v.me.trim().replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 10);
    return '恋人独占契約書_' + (s || 'me');
  }
  function toBlob(c) { return new Promise(function (res) { c.toBlob(res, 'image/png'); }); }
  async function fresh() { clearTimeout(timer); await render(); return canvases.slice(); }
  function saveBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }
  async function savePng() {
    if (busy) return;
    busy = true; status = ''; updateActions();
    try {
      var cs = await fresh(), base = fileBase();
      for (var i = 0; i < cs.length; i++) {
        var blob = await toBlob(cs[i]);
        saveBlob(blob, cs.length > 1 ? base + '_' + (i + 1) + 'of' + cs.length + '.png' : base + '.png');
      }
      busy = false; say('PNG画像を保存しました。保存できていないときは、下の「画像を表示」を使ってください。');
    } catch (e) { busy = false; say('保存できませんでした。「画像を表示」から長押しで保存してください。'); }
  }
  async function savePdf() {
    if (!J || busy) return;
    busy = true; status = ''; updateActions();
    try {
      var cs = await fresh();
      var pdf = new J({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      pdf.setProperties({ title: CFG.title });
      cs.forEach(function (c, i) {
        if (i) pdf.addPage();
        pdf.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      });
      saveBlob(pdf.output('blob'), fileBase() + '.pdf');
      busy = false; say('PDFを保存しました。');
    } catch (e) { busy = false; say('PDFを保存できませんでした。PNG画像で保存してください。'); }
  }
  async function copyImage(c) {
    try {
      var blob = await toBlob(c);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      say('画像をコピーしました。Xの投稿画面に貼り付けできます。');
    } catch (e) { say('コピーできませんでした。画像を長押し（右クリック）して保存してください。'); }
  }
  async function showSaveBox() {
    if (busy) return;
    busy = true; status = ''; updateActions();
    try {
      var cs = await fresh(), list = $('savelist');
      list.textContent = '';
      cs.forEach(function (c, i) {
        var item = document.createElement('div'); item.className = 'saveitem';
        var img = document.createElement('img');
        img.alt = '契約書 ' + (i + 1) + 'ページ目（保存用）';
        img.src = c.toDataURL('image/png');
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'btn sub';
        b.textContent = cs.length > 1 ? (i + 1) + 'ページ目の画像をコピー' : '画像をコピー';
        b.addEventListener('click', function () { copyImage(c); });
        item.appendChild(img); item.appendChild(b); list.appendChild(item);
      });
      var box = $('savebox');
      box.hidden = false;
      box.scrollIntoView({ block: 'start' });
    } finally { busy = false; updateActions(); }
  }
  btnPng.addEventListener('click', savePng);
  btnPdf.addEventListener('click', savePdf);
  btnShow.addEventListener('click', showSaveBox);
  $('btn-closebox').addEventListener('click', function () { $('savebox').hidden = true; });
  btnX.href = 'https://x.com/intent/post?text=' + encodeURIComponent(('独占契約書ができました！ ' + CFG.hashtag).trim());


  renderStep();
})();
</script>
</body>
</html>
